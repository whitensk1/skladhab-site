<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Контакты</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container inner">
        <a class="logo" href="index.html"><span class="tbd">Бренд</span></a>
        <a class="btn btn-primary" href="index.html#lead">Получить смету</a>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h1>Контакты</h1>
        <p class="lead">Все поля — из Q-01 / Q-02. Пока плейсхолдеры.</p>
        <div class="grid-3">
          <article class="card">
            <h3>Телефон</h3>
            <p><span class="tbd">+7 …</span></p>
          </article>
          <article class="card">
            <h3>Telegram / WhatsApp</h3>
            <p><span class="tbd">@… / wa.me</span></p>
          </article>
          <article class="card">
            <h3>Email</h3>
            <p><span class="tbd">info@…</span></p>
          </article>
          <article class="card">
            <h3>Склад</h3>
            <p><span class="tbd">адрес</span></p>
            <p class="form-note"><span class="tbd">режим работы</span></p>
          </article>
          <article class="card">
            <h3>Юр. адрес</h3>
            <p><span class="tbd">если отличается</span></p>
          </article>
          <article class="card">
            <h3>Реквизиты</h3>
            <p><span class="tbd">ИНН, ОГРН — по готовности</span></p>
          </article>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-bottom" style="margin: 0; border: 0; padding-top: 0">
        <a href="index.html">← На главную</a>
        <span>© <span data-year></span></span>
      </div>
    </footer>
    <script src="../src/js/main.js"></script>
  </body>
</html>
